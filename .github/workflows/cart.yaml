name: Cart

on:
  push:
    branches:
      - main
    paths:
      - 'cart/**'  # Trigger on changes to any files in the cart directory
      - '.github/workflows/cart.yaml'  # Include workflow file changes

  pull_request:
    branches:
      - main
    paths:
      - 'cart/**'  # Trigger on changes to any files in the cart directory
      - '.github/workflows/cart.yaml'  # Include workflow file changes

jobs:
  cart:
    name: Build and deploy cart microservice
    runs-on: ubuntu-latest  # Use a standard runner instead of self-hosted

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

        # Enable Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

       #Login to Dockerhub
      - name: Docker Login (use secrets)
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build image for PR validation
      - name: Build Docker image for PR validation
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./cart
          push: false  # Don't push for PR validation
          tags: cart:pr-${{ github.event.pull_request.number }}  # Tag with PR number

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./cart
          push: true  # Push the image to registry
          tags: |
               ${{ secrets.DOCKERHUB_USERNAME }}/cart:${{ github.sha }}  # Tag with commit SHA for traceability
               ${{ secrets.DOCKERHUB_USERNAME }}/cart:latest  # Tag as latest for main branch pushes
                


        