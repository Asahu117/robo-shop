name: Dispatch

on:
  push:
    branches:
      - main
    paths:
      - 'dispatch/**'  # Trigger on changes to any files in the dispatch directory
      - '.github/workflows/dispatch.yaml'  # Include workflow file changes

  pull_request:
    branches:
      - main
    paths:
      - 'dispatch/**'  # Trigger on changes to any files in the dispatch directory
      - '.github/workflows/dispatch.yaml'  # Include workflow file changes

jobs:
  dispatch:
    name: Build and deploy dispatch microservice
    runs-on: ubuntu-latest  # Use a standard runner instead of self-hosted

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login (use secrets)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: PR Validation - Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./dispatch
          push: false  # Don't push for PR validation
          tags: dispatch:pr-${{ github.event.pull_request.number }}  # Tag with PR number

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./dispatch
          push: true  # Push the image to registry
          tags: |
                ${{ secrets.DOCKERHUB_USERNAME }}/dispatch:${{ github.sha }}  # Tag with commit SHA for traceability
                ${{ secrets.DOCKERHUB_USERNAME }}/dispatch:latest  # Tag as latest for main branch pushes
