name: shipping

on:
  push:
    branches:
      - main
    paths:
      - 'shipping/**'  # Only trigger on changes to any files in the shipping directory
      - '.github/workflows/shipping.yaml'  # Include workflow file changes

  pull_request:
    branches:
      - main
    paths:
      - 'shipping/**'  # Only trigger on changes to any files in the shipping directory
      - '.github/workflows/shipping.yaml'  # Include workflow file changes

jobs:
  shipping:
    name: Build and deploy shipping microservice
    runs-on: ubuntu-latest  # Use a standard runner instead of self-hosted

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login (use secrets)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: PR Validation - Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./shipping
          push: false  # Don't push for PR validation
          tags: shipping:pr-${{ github.event.pull_request.number }}  # Tag with PR number

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./shipping
          push: true  # Push the image to registry
          tags: |
                ${{ secrets.DOCKERHUB_USERNAME }}/shipping:${{ github.sha }}  
                ${{ secrets.DOCKERHUB_USERNAME }}/shipping:latest  
