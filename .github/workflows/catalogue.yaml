name: Catalogue

on:
  push:
    branches:
      - main
    paths:
      - 'catalogue/**'  # Trigger on changes to any files in the catalogue directory
      - '.github/workflows/catalogue.yaml'  # Include workflow file changes

  pull_request:
    branches:
      - main
    paths:
      - 'catalogue/**'  # Trigger on changes to any files in the catalogue directory
      - '.github/workflows/catalogue.yaml'  # Include workflow file changes

jobs:
  catalogue:
    name: Build and deploy catalogue microservice
    runs-on: ubuntu-latest  # Use a standard runner instead of self-hosted

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
     
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login (use secrets)
        uses: docker/login-action@v4
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: PR Validation - Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
           context: ./catalogue
           push: false  # Don't push for PR validation
           tags: catalogue:pr-${{ github.event.pull_request.number }}  # Tag with PR number

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
           context: ./catalogue
           push: true  # Push the image to registry
           tags: |
               ${{ secrets.DOCKERHUB_USERNAME }}/catalogue:${{ github.sha }}  # Tag with commit SHA for traceability
               ${{ secrets.DOCKERHUB_USERNAME }}/catalogue:latest  # Tag as latest for main branch pushes
